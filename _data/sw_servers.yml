- name: Servers
  software:
    - name: Codename IRCat
      link: https://ircat.xyz
      support:
        stable:
          account-tag:
          cap-3.1:
          cap-3.2:
          server-time:
          webirc:

    - name: Ergo
      # ref: https://github.com/ergochat/ergo/blob/stable/irc/caps/defs.go
      link: https://ergo.chat/
      support:
        stable:
          account-notify:
          account-registration:
          account-tag:
          away-notify:
          batch:
          bot-mode:
          cap-3.1:
          cap-3.2:
          cap-notify:
          channel-rename:
          chathistory:
          chghost:
          echo-message:
          extended-join:
          extended-monitor:
          invite-notify:
          labeled-response:
          message-redaction:
          message-tags:
          metadata: Git
          monitor:
          msgid:
          multi-prefix:
          multiline:
          no-implicit-names:
          pre-away:
          read-marker:
          sasl-3.1:
          sasl-3.2:
          server-time:
          setname:
          standard-replies:
          sts:
          userhost-in-names:
          utf8only:
          webirc:
          websockets:
          whox:
      na:
        stable:
          starttls: supports sts

    - name: IRCCloud Teams
      # maintainer: jwheare
      link: https://blog.irccloud.com/private-teams-servers/
      support:
        stable:
          account-tag:
          away-notify:
          batch:
          cap-3.1:
          cap-3.2:
          cap-notify:
          echo-message:
          extended-join:
          labeled-response:
          message-tags:
          monitor:
          multiline:
          msgid:
          multi-prefix:
          setname:
          sts:
          userhost-in-names:
          whox:
      na:
        stable:
          starttls: supports sts
          webirc:

    - name: ircd-hybrid
      link: https://github.com/ircd-hybrid/ircd-hybrid
      support:
        stable:
          account-extban:
          account-notify:
          away-notify:
          cap-3.1:
          cap-3.2:
          cap-notify:
          chghost:
          echo-message:
          extended-join:
          invite-notify:
          monitor:
          multi-prefix:
          sasl-3.1:
          sasl-3.2:
          userhost-in-names:
          webirc:
          whox:
      partial:
        stable:
          bot-mode: Draft

    - name: InspIRCd
      # maintainer: Sadie
      # ref: https://github.com/inspircd/inspircd/search?q="Cap%3A%3ACapability"
      link: https://www.inspircd.org
      support:
        stable:
          account-extban: 4.10.0+
          account-notify:
          account-tag:
          away-notify:
          batch:
          bot-mode:
          cap-3.1:
          cap-3.2:
          cap-notify:
          chghost:
          echo-message:
          extended-join:
          extended-monitor:
          invite-notify:
          labeled-response:
          message-tags:
          monitor:
          msgid:
          multi-prefix:
          no-implicit-names:
          sasl-3.1:
          sasl-3.2:
          server-time:
          setname:
          standard-replies:
          starttls:
          sts:
          userhost-in-names:
          utf8only:
          webirc:
          websockets:
          whox:

    - name: ircu2
      # ref: https://github.com/UndernetIRC/ircu2/blob/c18c2f135e01b6d47687690e224aa46a82fb023b/include/capab.h#L42
      link: https://github.com/UndernetIRC/ircu2
      support:
        stable:
          account-notify:
          away-notify:
          cap-3.1:
          cap-3.2:
          cap-notify:
          chghost:
          echo-message:
          extended-join:
          invite-notify:
          message-tags:
          sasl-3.1:
          sasl-3.2:
          server-time:
          userhost-in-names:
          webirc:
          websockets:
          whox:

    - name: juno
      # ref: $mod->register_capability() calls in https://github.com/cooper/juno/search?q=$mod->register_capability
      link: https://github.com/cooper/juno
      support:
        stable:
          account-notify:
          account-tag:
          away-notify:
          batch:
          cap-3.1:
          cap-3.2:
          cap-notify:
          chghost:
          echo-message:
          extended-join:
          standard-replies:
          userhost-in-names:
          utf8only:
          whox:
      partial:
        stable:
          message-tags: "not sent over S2S"

    - name: Nefarious IRCu
      # ref: https://github.com/evilnet/nefarious2/blob/2.0/ircd/m_cap.c#L59
      link: https://github.com/evilnet/nefarious2
      ai: true
      support:
        stable:
          cap-3.1:
          sasl-3.1:
          account-notify:
          away-notify:
          extended-join:
          multi-prefix:
          starttls:
          userhost-in-names:
          webirc:
          whox:

    - name: Planio Team Chat
      link: https://plan.io/business-chat/
      support:
        stable:
          cap-3.1:
          sasl-3.1:
          away-notify:
          server-time:
      na:
        stable:
          webirc:

    - name: Solanum
      # ref: https://github.com/solanum-ircd/solanum/search?q=%28"capability_put%28cli_capindex"+OR+MAPI_CAP_CLIENT%29
      link: https://github.com/solanum-ircd/solanum
      support:
        stable:
          account-extban:
          account-notify:
          account-tag:
          away-notify:
          batch: 2026-01-21
          bot-mode: 2026-08-14
          cap-3.1:
          cap-3.2:
          cap-notify:
          chghost:
          echo-message:
          extended-join:
          invite-notify:
          labeled-response: 2026-05-12
          message-tags:
          monitor:
          msgid:
          multi-prefix:
          no-implicit-names: 2026-03-19
          sasl-3.1:
          sasl-3.2:
          server-time:
          starttls:
          userhost-in-names:
          webirc:
          whox:

    - name: UnrealIRCd
      # ref: ClientCapabilityAdd() calls in https://github.com/unrealircd/unrealircd/search?q=ClientCapabilityAdd
      #      (src/modules/m_cap.c has four matches, two not shown)
      link: https://www.unrealircd.org
      ai: true
      support:
        stable:
          account-extban:
          account-notify:
          account-tag:
          away-notify:
          batch:
          bot-mode:
          cap-3.1:
          cap-3.2:
          cap-notify:
          chathistory:
          chghost:
          echo-message:
          extended-isupport: 6.2+
          extended-join:
          extended-monitor:
          invite-notify:
          labeled-response:
          message-tags:
          monitor:
          msgid:
          multi-prefix:
          multiline: 6.2.4+
          network-icon: 6.2.2+
          no-implicit-names: 6.2.6+
          sasl-3.1:
          sasl-3.2:
          server-time:
          setname:
          standard-replies:
          starttls:
          sts:
          userhost-in-names:
          utf8only: 6.2+
          webirc:
          websockets:
          whox:
      partial:
        stable:
          account-registration: "6.0+ add-on"
          channel-rename: "6.1+ add-on"
          message-redaction: "6.0+ add-on"
          metadata: "6.1+ add-on"
